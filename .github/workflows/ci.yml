name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uvx ruff check .
      # Mocked LLM and mocked data: no API keys, no network calls to providers.
      - run: uv run pytest -m "not slow"
